<!-- @dsCard group="Components" viewport="1180x900" name="Actions & status" subtitle="Buttons, badges, and the shared state vocabulary" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Actions & status</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:40px 44px;background:var(--color-canvas)}.spec{max-width:1140px;display:flex;flex-direction:column;gap:36px}.sec>h3{margin-bottom:4px}.sec>.hint{display:block;margin-bottom:14px;max-width:70ch}.demo{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;padding:20px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md)}.demo.col{flex-direction:column;align-items:stretch}.cap{font-size:var(--text-2xs);color:var(--color-text-subtle);text-transform:uppercase;letter-spacing:var(--tracking-caps);font-weight:600}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {Button,ButtonGroup,Badge,StatusBadge,STATUSES,Input,Textarea,Select,Checkbox,Switch,SegmentedControl,Money,Avatar,PersonCell,AvatarStack,StatCard,DataTable,AppShell,PageHeader,Tabs,Stepper,Alert,Modal,EmptyState}=window.Nocturne_noctur;
function Sec({title,note,children,col}){return <section className="sec"><h3>{title}</h3><span className="hint">{note}</span><div className={col?'demo col':'demo'}>{children}</div></section>;}

function Page(){return <>
  <Sec title="Buttons" note="One primary per view. Everything else is secondary or ghost; destructive actions are red only when they delete or suspend.">
    <Button variant="primary">Run payroll</Button>
    <Button>Import Excel</Button>
    <Button variant="ghost">Cancel</Button>
    <Button variant="danger">Suspend org</Button>
    <Button variant="quiet-danger">Delete role</Button>
    <Button variant="primary" disabled>Approve</Button>
  </Sec>
  <Sec title="Sizes" note="sm inside table rows and toolbars, md everywhere, lg only on auth and wizard footers.">
    <Button size="sm">Small</Button><Button>Medium</Button><Button size="lg" variant="primary">Create my organization</Button>
    <ButtonGroup><Button size="sm">Month</Button><Button size="sm">Quarter</Button><Button size="sm">Year</Button></ButtonGroup>
  </Sec>
  <Sec title="Status vocabulary" note="StatusBadge owns every state in the product, so 'Paid' looks identical on the payslip list, the run summary and the employee profile.">
    {STATUSES.map(s=><StatusBadge key={s} status={s}/>)}
  </Sec>
  <Sec title="Badges" note="Badge is for taxonomy — department, plan, role type. Turn the dot off when it is not a state.">
    <Badge dot={false}>Engineering</Badge><Badge tone="info" dot={false}>System role</Badge><Badge tone="outline" dot={false}>Custom role</Badge><Badge tone="success">Bank verified</Badge><Badge tone="warning">UAN missing</Badge><Badge tone="danger">TDS mismatch</Badge>
  </Sec>
</>;}

ReactDOM.createRoot(document.getElementById('root')).render(<div className="spec"><Page/></div>);
</script></body></html>
