<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
.brandarea{display:flex;align-items:center;justify-content:center;background:var(--primary-500)}
.brandarea span{font-family:var(--font-sans);font-weight:600;font-size:118px;letter-spacing:-.045em;color:#fff}
.sw{display:grid;grid-template-rows:repeat(4,1fr)}.sw>div{width:100%;height:100%}</style></head>
<body><div class="brandarea"><svg viewBox="0 0 40 40" width="160" height="160" style="margin-right:26px"><path d="M28.2 29.2A13 13 0 1 1 33 20H7" fill="none" stroke="#fff" stroke-width="5.4" stroke-linecap="round"/></svg><span>Emplora</span></div>
<div class="sw"><div style="background:var(--primary-200)"></div><div style="background:var(--warning-500)"></div><div style="background:var(--success-500)"></div><div style="background:var(--primary-800)"></div></div>
</body></html>
